name: fraud-detection
services:

  # REDIS
  # Utilisé pour les OTP et les données temporaires

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

  # KAFKA
  # Broker de streaming de la plateforme

  kafka:
    image: apache/kafka:4.0.0
    container_name: fraud-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  spark:
    image: apache/spark:3.5.6-scala2.12-java11-python3-ubuntu
    container_name: fraud-spark
    restart: "no"

    volumes:
    - ../../streaming/spark:/opt/spark-apps

    working_dir: /opt/spark-apps

    command:
    - /opt/spark/bin/spark-submit
    - --master
    - local[2]
    - --conf
    - spark.jars.ivy=/tmp/.ivy
    - --packages
    - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6
    - /opt/spark-apps/streaming_consumer.py
  
    depends_on:
    - kafka
volumes:
  redis_data:
